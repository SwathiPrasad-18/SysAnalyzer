[package]
name = "ai-sysanalyzer"
version = "1.0.0"
edition = "2021"
authors = ["AI SysAnalyzer"]
description = "AI-Based Live System Analyzer - Complete Platform"

[[bin]]
name = "ai-sysanalyzer"
path = "src/main.rs"

[dependencies]
# System info
sysinfo = "0.31"


# TUI
ratatui = "0.28"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Data processing & AI
statrs = "0.17"
nalgebra = "0.33"

# Serialization & reporting
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Utilities
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
flume = "0.11"
eframe = "0.31.1"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.16"
